name: BuildAndRunTests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
    - src/**
    - tests/**
    - Directory.Build.props
    - Directory.Packages.props
  pull_request:
    branches: [ "main" ]
    paths:
    - src/**
    - tests/**
    - Directory.Build.props
    - Directory.Packages.props

jobs:
  build:
    # Airlock drives Windows Sandbox, and its tool detection looks for Program Files, so the tests
    # only mean anything on Windows.
    runs-on: windows-latest

    steps:
    - name: Checkout Airlock.slnx
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore src/Airlock.slnx

    - name: Build
      run: dotnet build --no-restore src/Airlock.slnx --property WarningLevel=0

    # xunit.v3 runs on Microsoft Testing Platform, where `dotnet test` takes --solution rather than a
    # positional path. Given a positional path it runs nothing at all and reports "Zero tests ran".
    - name: Test
      run: dotnet test --solution src/Airlock.slnx --no-build
